{{/*
Credentials for the lakeFS S3 gateway, materialised by the External Secrets
Operator from the Key Vault. The annotations are read by KServe's storage
initializer, not by ESO: they tell it which endpoint to talk to and that the
gateway requires path-style addressing, because lakeFS resolves the first path
segment of the key as the ref.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "model.storageSecretName" . }}
  labels: {{- include "model.labels" . | nindent 4 }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: {{ .Values.storage.secretStore.name }}
    kind: {{ .Values.storage.secretStore.kind }}
  target:
    name: {{ include "model.storageSecretName" . }}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.storage.endpoint | quote }}
          serving.kserve.io/s3-usehttps: {{ .Values.storage.useHttps | quote }}
          serving.kserve.io/s3-region: {{ .Values.storage.region | quote }}
          serving.kserve.io/s3-usevirtualbucket: "false"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.storage.keys.accessKeyId }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.storage.keys.secretAccessKey }}
