apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kserve
  namespace: argocd
  labels:
    mlops.tuwien/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kserve
  sources:
  - repoURL: ghcr.io/kserve/charts
    chart: kserve-crd
    targetRevision: v0.15.0

  - repoURL: ghcr.io/kserve/charts
    chart: kserve
    targetRevision: v0.15.0
    helm:
      releaseName: kserve
      valueFiles:
        - $values/clusters/base/_skeleton/platform/components/kserve/values.yaml

  # Value-file reference only: this source carries no `path`, so it generates no
  # manifests. The referenced directory holds a values file, not a manifest.
  - repoURL: https://github.com/michi2402/mlops-apps
    targetRevision: master
    ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
