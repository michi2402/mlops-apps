apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-mlflow
  sources:
    - repoURL: https://github.com/community-charts/helm-charts
      targetRevision: mlflow-1.6.2
      path: charts/mlflow
      helm:
        releaseName: mlflow
        valueFiles:
          - $values/clusters/base/_skeleton/platform/components/mlflow/values.yaml

    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      path: clusters/base/_skeleton/platform/components/mlflow
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
