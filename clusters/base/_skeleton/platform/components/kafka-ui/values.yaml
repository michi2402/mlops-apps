yamlApplicationConfig:
  kafka:
    clusters:
      - name: "Platform Kafka"
        bootstrapServers:  platform-kafka-kafka-brokers.platform-kafka.svc.cluster.local:9092
  auth:
    type: disabled
  management:
    health:
      ldap:
        enabled: false

# Sizing rule: RESOURCES.md (observed 402Mi, E61).
resources:
  requests: { cpu: 50m, memory: 512Mi }
  limits:   { cpu: 500m, memory: 1Gi }
