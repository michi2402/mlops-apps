namespaceOverride: platform-postgres
cluster:
  instances: 2
  # Backs the provisioned cloud-native-pg Grafana dashboard.
  monitoring:
    enabled: true
  storage:
    size: 1Gi
  # Per instance. Sizing rule: RESOURCES.md (observed 157Mi, E61).
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1", memory: 512Mi }
  roles:
    - name: postgres-mlflow
      login: true
      passwordSecret:
        name: platform-postgres-mlflow-secret
    - name: postgres-lakefs
      login: true
      passwordSecret:
        name: platform-postgres-lakefs-secret
