apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-katib
  namespace: argocd
  labels:
    mlops.tuwien/tier: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kubeflow
  source:
    repoURL: https://github.com/kubeflow/katib.git
    targetRevision: v0.17.0    
    path: manifests/v1beta1/installs/katib-cert-manager
    kustomize:
      patches:
        # Namespace `kubeflow` has exactly one owner: platform-kubeflow-namespaces
        # (see kfp-crds.yaml). Katib's copy is removed from the render.
        - target:
            kind: Namespace
          patch: |-
            $patch: delete
            apiVersion: v1
            kind: Namespace
            metadata:
              name: kubeflow
  # Katib's webhook manifests carry a placeholder caBundle (Cg==) that cert-manager's
  # cainjector replaces with the real CA. Without this the Application reads OutOfSync for
  # good, and self-heal writes the placeholder back, breaking the webhooks until the
  # injector restores them. The field belongs to cert-manager, so Argo CD leaves it alone.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true