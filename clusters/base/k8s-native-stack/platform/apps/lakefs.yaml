apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-lakefs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-lakefs
  sources:
    - repoURL: https://charts.lakefs.io
      chart: lakefs
      targetRevision: 1.7.5
      helm:
        releaseName: lakefs
        valueFiles:
          - $values/clusters/base/k8s-native-stack/platform/components/lakefs/values.yaml

    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      path: clusters/base/k8s-native-stack/platform/components/lakefs
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true