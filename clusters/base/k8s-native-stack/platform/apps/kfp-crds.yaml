apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kfp-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kubeflow
  sources:
    - repoURL: https://github.com/kubeflow/pipelines.git
      targetRevision: 2.14.0
      path: manifests/kustomize/cluster-scoped-resources
      kustomize:
        patches:
          # KFP ships the kubeflow namespace too and would drop the Katib label from
          # kubeflow-namespaces; without it Katib injects no metrics collector and
          # trials hang in Running forever
          # Name erst nach der Variablenersetzung 'kubeflow', daher nur nach Kind filtern
          - target:
              kind: Namespace
            patch: |-
              - op: add
                path: /metadata/labels
                value:
                  katib.kubeflow.org/metrics-collector-injection: "enabled"
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Namespace
      name: kubeflow
      jsonPointers:
        - /metadata/labels