replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  # The chart's own default (targetPort: http) resolves to the container port it names
  # "http", which the chart wires to Redpanda Connect's own admin/stream-status server
  # (4195) -- not to whatever port a custom `config.input.http_server` listens on. Our
  # pipeline's HTTP input below binds 8080, so the Service must target it explicitly,
  # numerically, or every request the KServe logger sends 404s against the admin server
  # instead of reaching /ingest/kserve. Found via the validation campaign (E10/FINDING-04):
  # the inference-events topic was empty because of exactly this.
  targetPort: 8080
  annotations: {}
  labels: {}

# Minimal pipeline: HTTP server input -> (optional) header extraction -> Kafka output
config: |
  input:
    http_server:
      address: 0.0.0.0:8080
      path: /ingest/kserve
      # Accept CloudEvents content types transparently
      allowed_verbs: [ POST ]
      rate_limit: ""
  pipeline:
    processors:
      - bloblang: |
          root = {
            "body": this,                # raw event body (CloudEvent in structured mode)
            "headers": meta()            # all HTTP headers (includes CE- prefixed headers if binary)
          }
  output:
    kafka:
      addresses:
        - platform-kafka-kafka-bootstrap.platform-kafka.svc.cluster.local:9092
      topic: inference-events
      # Key by CloudEvent id. KServe emits two events per inference -- the request
      # before the predictor is invoked and the response after -- carrying the same
      # ce-id. Keying co-partitions the pair, so a drift detector reconstructs
      # (features, prediction) within one partition instead of joining across all of
      # them. Messages without an identifiable id fall back to a random key so they
      # still spread rather than piling onto one partition.
      key: ${! meta("ce-id").or(meta("Ce-Id")).or(json("body.id")).or(uuid_v4()) }
      max_in_flight: 64
      compression: none
      static_headers:
        content-type: ${! meta("Content-Type") }
  metrics:
    prometheus: {}
  logger:
    level: INFO

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The chart's ServiceMonitor scrapes the container port named `http` -- the admin
# server (4195), where /metrics lives -- not the Service port, which targets the
# pipeline input above.
serviceMonitor:
  enabled: true
