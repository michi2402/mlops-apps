# The administrator's key pair, for the init hook below. It is the same vault entry the
# tracking service and the model chart read, so the admin lakeFS creates is the identity
# every client already holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-lakefs-admin
  namespace: platform-lakefs
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: platform-lakefs-admin
    creationPolicy: Owner
  data:
    - secretKey: accessKeyID
      remoteRef:
        key: platform-lakefs-access-key
    - secretKey: secretAccessKey
      remoteRef:
        key: platform-lakefs-secret-key
