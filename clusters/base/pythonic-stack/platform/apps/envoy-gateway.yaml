apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-envoy-gateway
  namespace: argocd
  labels:
    mlops.tuwien/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-envoy-gateway
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.5.1
      helm:
        valuesObject:
          deployment:
            envoyGateway:
              # Sizing rule: RESOURCES.md (observed 94Mi, E61).
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      path: clusters/base/pythonic-stack/platform/components/envoy-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
