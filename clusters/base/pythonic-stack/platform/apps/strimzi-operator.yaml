# Strimzi Kafka operator: installs the Kafka CRDs and the cluster operator.
#
# Occupies the first wave of the streaming tier so that the custom resources in
# platform-kafka (wave 1) have their definitions in place before they are applied.
#
# watchAnyNamespace is deliberately false. Every Kafka resource in this platform
# lives in the operator's own namespace, which Strimzi watches by default, so a
# cluster-wide watch would grant the operator three further ClusterRoleBindings it
# has no use for. Per-tenant topics in tenant namespaces would be the reason to
# revisit this, and would be a value change rather than a structural one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kafka-operator
  namespace: argocd
  labels:
    mlops.tuwien/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 0.48.0
      helm:
        valuesObject:
          watchAnyNamespace: false

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
