# Scheduler
scheduler:
  replicas: 1
  serviceType: NodePort       # Dashboard leicht erreichbar
  nodePort: 31040             # http://$(minikube ip):31040/status
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  # Scheduler and workers run the TSFresh step's own image, so that client, scheduler and
  # workers share one distributed version and the workers can import tsfresh. With the
  # chart's stock image (dask 2024.1.0, no tsfresh) the client handshake fails and the
  # TSFresh step silently falls back to local multiprocessing.
  image:
    repository: ghcr.io/julianzeilinger/tsfresh
    tag: main
    pullPolicy: Always
    pullSecrets:
      - name: ghcr-creds

# Worker
worker:
  image:
    repository: ghcr.io/julianzeilinger/tsfresh   # same image as the scheduler, see above
    tag: main
    pullPolicy: Always
    dask_worker: dask-worker
    pullSecrets:
      - name: ghcr-creds
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 2Gi }
  env:
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__TARGET
      value: "0.85"
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__SPILL
      value: "0.90"
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE
      value: "0.95"

# Gemeinsame ENV für S3/lakeFS (falls du von Jobs/TSFresh direkt darauf zugreifst)
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef: { name: platform-lakefs-secret, key: accessKeyID }   # TODO: Secret anlegen
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef: { name: platform-lakefs-secret, key: secretAccessKey }   # TODO: Secret anlegen
  - name: AWS_REGION
    value: "us-east-1"
  - name: AWS_EC2_METADATA_DISABLED
    value: "true"
  # lakeFS S3-Gateway statt direktem MinIO, damit Branches/Commits wirken:
  - name: S3_ENDPOINT
    value: "http://lakefs.platform-lakefs.svc.cluster.local:80"
  - name: S3_USE_HTTPS
    value: "false"
  - name: S3_VERIFY_SSL
    value: "false"

# Optionale Prometheus-Erfassung (falls du Prometheus Operator nutzt)
