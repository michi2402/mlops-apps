backendStore:
  databaseMigration: true
  postgres:
    enabled: true
    host: postgres-cluster-rw.platform-postgres.svc
    port: 5432
    database: mlflow

  existingDatabaseSecret:
    name: platform-postgres-mlflow-secret
    usernameKey: username
    passwordKey: password

artifactRoot:
  proxiedArtifactStorage: true
  s3:
    enabled: true
    # lakeFS repository. The gateway resolves <bucket>/<first path segment> as
    # repository/ref, so the destination must carry a ref: without `path`, the
    # chart renders --artifacts-destination=s3://mlflow/ and MLflow then writes to
    # s3://mlflow/<experiment-id>/..., where lakeFS reads the experiment id as a
    # branch name and rejects the upload with NoSuchBucket. `path: main` makes the
    # default artifact root resolve to the repository's default branch.
    bucket: mlflow
    path: main
    existingSecret:
      name: platform-lakefs-secret
      keyOfAccessKeyId: accessKeyID
      keyOfSecretAccessKey: secretAccessKey

extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: "http://lakefs.platform-lakefs.svc.cluster.local:80"

serviceMonitor:
  enabled: true
  useServicePort: true
  namespace: platform-mlflow

# Sized for the chart's four server workers. Sizing rule: RESOURCES.md (observed
# 779Mi, E61). The worker count is an environment property and set by the profiles.
resources:
  requests: { cpu: 50m, memory: 1Gi }
  limits:   { cpu: "1", memory: 2Gi }
