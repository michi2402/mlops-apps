apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-team1-iris
  namespace: team1
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads-team1
  destination:
    server: https://kubernetes.default.svc
    namespace: team1-iris
  source:
    repoURL: https://github.com/michi2402/mlops-apps
    path: base/charts/model
    targetRevision: master
    helm:
      valuesObject:
        fullnameOverride: "iris"
        # Names, not an MLflow artifact id: scripts/promote-model.py materialises
        # s3://mlflow/main/serving/tracking-quickstart/1 in lakeFS. Raising the
        # version here is the promotion event.
        model:
          name: "tracking-quickstart"
          version: "1"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
