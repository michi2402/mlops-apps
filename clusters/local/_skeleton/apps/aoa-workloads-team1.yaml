apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-team1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads-team1
  source:
    repoURL: https://github.com/michi2402/mlops-apps
    targetRevision: master
    path: clusters/local/_skeleton/workloads/team1/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    # Child Applications are created in the tenant namespace rather than in
    # argocd, which is what binds them to this project via sourceNamespaces.
    namespace: team1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
