apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kubeflow-spark-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kubeflow-spark-operator
  sources:
  - repoURL: https://kubeflow.github.io/spark-operator
    chart: spark-operator
    targetRevision: 2.3.0
    helm:
      releaseName: spark-operator
      valueFiles:
        - $values/clusters/base/k8s-native-stack/platform/components/kubeflow-spark-operator/values.yaml

  - repoURL: https://github.com/michi2402/mlops-apps
    targetRevision: master
    path: clusters/base/k8s-native-stack/platform/components/kubeflow-spark-operator
    ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
