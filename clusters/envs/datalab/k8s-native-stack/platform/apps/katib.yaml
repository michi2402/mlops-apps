apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-katib
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kubeflow
  source:
    repoURL: https://github.com/kubeflow/katib.git
    targetRevision: v0.17.0    
    path: manifests/v1beta1/installs/katib-cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
