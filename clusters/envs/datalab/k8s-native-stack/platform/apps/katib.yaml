apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-katib
  namespace: argocd
  labels:
    mlops.tuwien/tier: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kubeflow
  source:
    repoURL: https://github.com/kubeflow/katib.git
    targetRevision: v0.17.0    
    path: manifests/v1beta1/installs/katib-cert-manager
    kustomize:
      patches:
        # Transition guard (phase 1b of 2): Katib's copy of Namespace `kubeflow` carries
        # the same Prune=false,Delete=false as the owner's. Phase 2 removes this copy.
        - target:
            kind: Namespace
          patch: |-
            - op: add
              path: /metadata/annotations
              value:
                argocd.argoproj.io/sync-options: Prune=false,Delete=false
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
