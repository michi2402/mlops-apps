apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rp-connect
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://charts.redpanda.com/
      chart: connect
      targetRevision: 3.0.3
      helm:
        valueFiles:
        - $values/clusters/base/k8s-native-stack/platform/components/rp-connect/values.yaml
        - $values/clusters/envs/datalab/k8s-native-stack/platform/components/rp-connect/values.yaml

    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-rp-connect

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
