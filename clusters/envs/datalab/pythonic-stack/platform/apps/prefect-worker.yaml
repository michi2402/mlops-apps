apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prefect-worker
  namespace: argocd
  labels:
    mlops.tuwien/tier: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-prefect
  sources:
    - repoURL: https://prefecthq.github.io/prefect-helm
      chart: prefect-worker
      targetRevision: "2026.9.26234203"   # Prefect 3.8.7; the chart index moves daily
      helm:
        releaseName: prefect
        valueFiles:
          - $values/clusters/base/pythonic-stack/platform/components/prefect/values-worker.yaml

    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      # Values only: the component's manifests are rendered by platform-prefect-server.
      # Rendering the directory from both Applications made each claim the other's
      # objects, so neither ever reported Synced.
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
