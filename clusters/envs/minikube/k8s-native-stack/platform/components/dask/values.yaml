# Distributed compute, single-node profile: one worker. Two workers on one node
# contend for the same cores, so the second buys scheduling overhead rather than
# parallelism.
worker:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
# The bundled notebook server is a development convenience; pipelines submit to the
# scheduler directly, so a single node does not carry it.
jupyter:
  enabled: false
