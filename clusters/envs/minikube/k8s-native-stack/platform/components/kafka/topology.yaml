# Event bus, single-node profile.
#
# One controller and one broker. A replication factor above one on a single node
# does not buy redundancy -- it buys copies inside the same failure domain -- so the
# factors are set to match the broker count rather than left at the multi-node
# values. The retained `inference-events` topic has to agree, or the topic operator
# cannot satisfy its replica count and the Day-2 substrate never comes up.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: platform-kafka-controllers
spec:
  replicas: 1
  resources:
    requests: { cpu: 50m,  memory: 512Mi }
    limits:   { cpu: 250m, memory: 768Mi }
  jvmOptions:
    -Xms: 256m
    -Xmx: 256m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: platform-kafka-brokers
spec:
  replicas: 1
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: platform-kafka
spec:
  kafka:
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: inference-events
spec:
  replicas: 1
  config:
    min.insync.replicas: 1
