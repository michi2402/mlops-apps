apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rp-connect
  namespace: argocd
  labels:
    mlops.tuwien/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://charts.redpanda.com/
      chart: connect
      targetRevision: 3.0.3
      helm:
        valueFiles:
        - $values/clusters/base/k8s-native-stack/platform/components/rp-connect/values.yaml
        - $values/clusters/envs/minikube/k8s-native-stack/platform/components/rp-connect/values.yaml

    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-rp-connect

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
