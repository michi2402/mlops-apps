apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  sources:
    - repoURL: https://github.com/external-secrets/external-secrets
      targetRevision: v0.19.2
      path: deploy/crds
      directory:
        include: bundle.yaml

    - repoURL: https://github.com/external-secrets/external-secrets
      targetRevision: v0.19.2
      path: deploy/charts/external-secrets
      helm:
        valuesObject:
          installCRDs: true

    - repoURL: https://github.com/michi2402/mlops-apps
      targetRevision: master
      path: base/external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
