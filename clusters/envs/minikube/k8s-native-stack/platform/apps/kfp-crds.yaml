apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kfp-crds
  namespace: argocd
  labels:
    mlops.tuwien/tier: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-kubeflow
  sources:
    - repoURL: https://github.com/kubeflow/pipelines.git
      targetRevision: 2.14.0
      path: manifests/kustomize/cluster-scoped-resources
      kustomize:
        patches:
          # Namespace `kubeflow` has exactly one owner: platform-kubeflow-namespaces.
          # KFP ships its own copy; two Applications declaring one object take its
          # ownership from each other on every sync, and this copy, lacking the Katib
          # label, once stripped it (0043a90: trials hung until the step timed out).
          # Removed from the render rather than patched to agree. The target is by kind
          # only: the name is substituted to `kubeflow` later in KFP's own build.
          - target:
              kind: Namespace
            patch: |-
              $patch: delete
              apiVersion: v1
              kind: Namespace
              metadata:
                name: kubeflow
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
