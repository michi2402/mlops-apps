apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dask
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-compute
  sources:
  - repoURL: https://helm.dask.org
    chart: dask
    targetRevision: 2024.1.1
    helm:
      releaseName: dask
      valueFiles:
        - $values/clusters/base/k8s-native-stack/platform/components/dask/values.yaml
        - $values/clusters/envs/minikube/k8s-native-stack/platform/components/dask/values.yaml

  - repoURL: https://github.com/michi2402/mlops-apps
    targetRevision: master
    path: clusters/base/k8s-native-stack/platform/components/dask
    ref: values
    
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
