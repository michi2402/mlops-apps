apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager
  namespace: argocd
  labels:
    mlops.tuwien/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  sources:
  - repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.18.2
    helm:
      valuesObject:
        crds:
          enabled: true
        # Backs the provisioned cert-manager Grafana dashboard.
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
        # Sizing rule: RESOURCES.md (observed 107Mi cainjector, E61; controller 72Mi
        # and webhook 52Mi in the laptop run).
        resources:
          requests: { cpu: 10m, memory: 128Mi }
          limits:   { cpu: 200m, memory: 256Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
        cainjector:
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Never give up on a failed sync: Argo CD does not re-attempt one against the
      # same revision, so a dependency still starting on the first attempt would
      # otherwise leave this OutOfSync for good. refresh: retries use the newest revision.
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
